---
version: "2.0"

services:
  lumabot:
    image: ghcr.io/YOUR_GITHUB_OWNER/auto-luma-mcp:latest
    expose:
      - port: 8000
        as: 80
        to:
          - global: true
    env:
      - LUMABOT_MCP_HOST=0.0.0.0
      - LUMABOT_MCP_PORT=8000
      - LUMABOT_RUNTIME_URL=http://127.0.0.1:8080
      - RUNTIME_HOST=127.0.0.1
      - RUNTIME_PORT=8080
      - HEADLESS=true
      - LUMABOT_ENRICHMENT_PROVIDER=visible
      - ZERO_MAX_PAY_USDC=0.25
      - PDL_MIN_LIKELIHOOD=1
profiles:
  compute:
    lumabot:
      resources:
        cpu:
          units: 2
        memory:
          size: 4Gi
        storage:
          size: 8Gi
  placement:
    dcloud:
      pricing:
        lumabot:
          denom: uakt
          amount: 1000

deployment:
  lumabot:
    dcloud:
      profile: lumabot
      count: 1
