[project]
name = "lumabot-mcp"
version = "0.1.0"
description = "Independently testable LumaBot MCP server"
readme = "TESTING.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp[cli]>=1.27,<2",
  "pydantic>=2.7,<3",
  "starlette>=0.37,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
lumabot-mcp = "lumabot_mcp.app:main"
lumabot-mcp-demo = "lumabot_mcp.demo:main"

[dependency-groups]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-anyio>=0.0.0",
  "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumabot_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

