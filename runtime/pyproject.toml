[project]
name = "lumabot-runtime"
version = "0.1.0"
description = "Independently testable LumaBot provider enrichment, scoring, and reporting workstream."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumabot_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
