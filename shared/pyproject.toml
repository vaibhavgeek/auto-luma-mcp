[project]
name = "lumabot-shared"
version = "0.1.0"
description = "Shared LumaBot Python contracts, scoring helpers, and sanitized fixtures."
readme = "../ARCHITECTURE.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic[email]>=2.8,<3",
]

[dependency-groups]
dev = [
  "psycopg[binary]>=3.2,<4",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
  "testcontainers[postgres]>=4.8,<5",
  "mypy>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumabot_shared"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
